[project]
name = "polars-talib-fast"
version = "0.0.0"  # placeholder: CI sets the version from the release tag, see ci.yml
description = "TA-Lib for Polars expressions, driven by TA-Lib's own function metadata"
readme = "README.md"
license = "MIT AND BSD-3-Clause"  # this package MIT; TA-Lib inside the wheel BSD-3-Clause
license-files = ["LICENSE", "LICENSES/TA-Lib.txt"]
requires-python = ">=3.10"
dependencies = ["polars>=1.0"]
authors = [{ name = "Radek" }]
keywords = ["polars", "ta-lib", "technical-analysis", "indicators", "finance"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Rust",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering",
]

[project.urls]
Homepage = "https://github.com/meet-brad-ch/polars-talib-fast"
Repository = "https://github.com/meet-brad-ch/polars-talib-fast"
Issues = "https://github.com/meet-brad-ch/polars-talib-fast/issues"
Changelog = "https://github.com/meet-brad-ch/polars-talib-fast/releases"

[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[tool.maturin]
python-source = "python"
module-name = "polars_talib_fast._polars_talib_fast"
features = ["pyo3/extension-module"]

# Rebuild the extension when any of its sources change, not only pyproject.toml.
[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "src/**/*.rs" },
    { file = "python/**/*.py" },
]

[dependency-groups]
dev = [
    "maturin>=1.15,<2",
    "mypy>=1.18",
    "numpy>=2",
    "pytest>=8",
    "ruff>=0.13",
    "ta-lib==0.8.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
extend-exclude = ["tools/c_oracle/ta-lib"]

[tool.ruff.format]
exclude = ["*.pyi"]  # generated by polars_talib_fast._stubs

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["polars_talib_fast", "data"]

[tool.ruff.lint.per-file-ignores]
"*.pyi" = ["E501"]  # generated: TA-Lib's parameter hints set the line length

[tool.mypy]
strict = true
files = ["python", "tests", "tools"]
# tests/data.py for the tools that reuse the test frames; the c_oracle stub next to its script.
mypy_path = ["tests", "tools/c_oracle"]
exclude = ["tools/c_oracle/ta-lib/"]

# ta-lib-python is untyped; take it as Any.
[[tool.mypy.overrides]]
module = ["talib", "talib.*"]
follow_imports = "skip"
