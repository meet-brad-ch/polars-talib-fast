name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write  # attach the wheel to the release of a v* tag

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v6
      - if: startsWith(github.ref, 'refs/tags/v')
        run: uv version "${GITHUB_REF_NAME#v}"  # the tag is the version
        shell: bash
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest -q
      - run: uv run maturin build --release --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-windows
          path: dist/*.whl
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.whl

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v6
      - if: startsWith(github.ref, 'refs/tags/v')
        run: uv version "${GITHUB_REF_NAME#v}"  # the tag is the version
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest -q
      # The wheel is built in a manylinux container, so it installs on any x86_64 Linux with
      # glibc 2.17 or newer, not only on the runner's Ubuntu.
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist
          manylinux: auto
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-linux
          path: dist/*.whl
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.whl

  macos:
    # Apple silicon (arm64). The golden values of the transcendental functions follow the
    # platform's libm and no macOS golden data is committed, so this job writes it from
    # TA-Lib's C library on the runner (the submodule, clang) before the tests.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v6
      - if: startsWith(github.ref, 'refs/tags/v')
        run: uv version "${GITHUB_REF_NAME#v}"  # the tag is the version
      - run: uv sync
      - run: bash tools/c_oracle/generate.sh
      - run: git diff --exit-code -- tests/golden/functions.json tests/golden/talib_reference.csv
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest -q
      - run: uv run maturin build --release --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-macos
          path: dist/*.whl
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.whl

  pypi:
    # Upload the wheels of a v* tag to PyPI. PyPI trusts this workflow directly (trusted
    # publishing), so there is no token to store: the job only needs an OIDC id-token.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux, macos]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
